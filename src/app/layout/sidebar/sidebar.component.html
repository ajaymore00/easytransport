<aside class="app-sidebar">
  <div class="app-sidebar__top">
    <div class="app-sidebar__brand">
      <span class="app-sidebar__brand-mark" aria-hidden="true">ET</span>
      <span class="app-sidebar__brand-copy">
        <strong>EasyTransport</strong>
        <small>FLEET MANAGEMENT</small>
      </span>
    </div>
    <button
      type="button"
      class="app-sidebar__close"
      (click)="closeRequested.emit()"
      aria-label="Close navigation menu"
    >
      <span aria-hidden="true">×</span>
    </button>
  </div>

  <div class="app-sidebar__section-label">WORKSPACE</div>
  <nav class="app-sidebar__nav" aria-label="Main navigation">
    <a
      *ngFor="let item of navigationItems"
      [routerLink]="item.route"
      routerLinkActive="app-sidebar__link--active"
      [routerLinkActiveOptions]="{ exact: item.exact }"
      ariaCurrentWhenActive="page"
      class="app-sidebar__link"
      (click)="closeRequested.emit()"
    >
      <span class="app-sidebar__link-icon" aria-hidden="true">{{ item.icon }}</span>
      <span>{{ item.label }}</span>
      <span class="app-sidebar__active-indicator" aria-hidden="true"></span>
    </a>
  </nav>

  <footer class="app-sidebar__footer">
    <div class="app-sidebar__status">
      <span class="app-sidebar__status-dot" aria-hidden="true"></span>
      <span>
        <strong>System ready</strong>
        <small>Transport operations</small>
      </span>
    </div>
    <span class="app-sidebar__copyright">© {{ currentYear }} EasyTransport</span>
  </footer>
</aside>
