<header class="app-header">
  <div class="app-header__inner">
    <button
      type="button"
      class="app-header__menu app-icon-button app-icon-button--quiet lg:hidden"
      (click)="menuToggle.emit()"
      aria-label="Open navigation menu"
    >
      <span aria-hidden="true">☰</span>
    </button>

    <div class="app-header__brand" aria-label="EasyTransport fleet management">
      <span class="app-header__brand-mark" aria-hidden="true">ET</span>
      <span class="app-header__brand-copy">
        <strong>EasyTransport</strong>
        <small>FLEET MANAGEMENT</small>
      </span>
    </div>

    <div class="app-header__actions">
      <div class="app-header__profile">
        <span class="app-header__profile-avatar" aria-hidden="true">{{ userInitials }}</span>
        <span class="app-header__profile-copy">
          <strong>{{ transporterName }}</strong>
          <small>{{ ownerName || 'Transporter account' }}</small>
        </span>
      </div>
      <span class="app-header__divider" aria-hidden="true"></span>
      <button type="button" class="app-header__logout" (click)="logout()">
        <span class="app-header__logout-icon" aria-hidden="true">↗</span>
        <span>Log out</span>
      </button>
    </div>
  </div>
</header>
