<div class="auth-page">
  <div class="auth-card">

    <div class="auth-brand">
      <div class="auth-brand__content">
        <h2>🔑 Reset Password</h2>
        <p>Regain access to your account with a quick verification.</p>
      </div>
    </div>

    <div class="auth-content">
      <div class="auth-heading">
        <span class="auth-kicker">Account recovery</span>
        <h2 class="auth-title">Forgot password?</h2>
        <p class="auth-subtitle">Enter your mobile number and we’ll send you a verification code.</p>
      </div>

      <form *ngIf="step === 1" (ngSubmit)="requestReset()" class="auth-form">
        <div class="auth-field">
          <label>Mobile Number</label>
          <input type="tel" [(ngModel)]="mobileNumber" name="mobileNumber" required
            autocomplete="tel" inputmode="numeric" minlength="10" maxlength="10" pattern="[0-9]{10}"
            title="Enter a 10-digit mobile number" placeholder="Enter your 10-digit mobile number">
        </div>

        <button type="submit" [disabled]="isLoading" class="app-button app-button--primary app-button--block">
          {{ isLoading ? 'Sending...' : 'Send OTP' }}
        </button>

        <p *ngIf="message" class="auth-message">{{ message }}</p>

        <div class="auth-footer">
          <a (click)="routeTo('/auth/login')">Back to Login</a>
        </div>
      </form>

      <form *ngIf="step === 2" (ngSubmit)="verifyReset()" class="auth-form">
        <div class="auth-field">
          <label>OTP</label>
          <input type="text" [(ngModel)]="otp" name="otp" required
            inputmode="numeric" autocomplete="one-time-code" placeholder="Enter verification code">
        </div>

        <div class="auth-grid">
          <div class="auth-field">
            <label>New Password</label>
            <div class="auth-input-wrap">
              <input [type]="showPassword ? 'text' : 'password'" [(ngModel)]="password" name="password" required
                autocomplete="new-password" placeholder="Create a new password">
              <button type="button" (click)="togglePassword()"
                class="app-icon-button app-icon-button--quiet app-icon-button--small auth-password-toggle"
                [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'">
                <i class="material-icons">{{ showPassword ? 'visibility_off' : 'visibility' }}</i>
              </button>
            </div>
          </div>
          <div class="auth-field">
            <label>Confirm Password</label>
            <div class="auth-input-wrap">
              <input [type]="showConfirmPassword ? 'text' : 'password'" [(ngModel)]="confirmPassword" name="confirmPassword" required
                autocomplete="new-password" placeholder="Confirm your password">
              <button type="button" (click)="toggleConfirmPassword()"
                class="app-icon-button app-icon-button--quiet app-icon-button--small auth-password-toggle"
                [attr.aria-label]="showConfirmPassword ? 'Hide password' : 'Show password'">
                <i class="material-icons">{{ showConfirmPassword ? 'visibility_off' : 'visibility' }}</i>
              </button>
            </div>
          </div>
        </div>

        <button type="submit" [disabled]="isLoading" class="app-button app-button--primary app-button--block">
          {{ isLoading ? 'Verifying...' : 'Reset Password' }}
        </button>
        <div class="text-center mt-2">
          <button type="button" (click)="resendOtp()" [disabled]="isLoading"
            class="app-button app-button--secondary app-button--compact">Resend OTP</button>
        </div>
      </form>
    </div>
  </div>
</div>
