<div class="auth-page">
  <div class="auth-card">

    <div class="auth-brand">
      <div class="auth-brand__content">
        <h2>🚚 Transport Portal</h2>
        <p>Manage your logistics faster and smarter with our platform.</p>
      </div>
    </div>

    <div class="auth-content">
      <div class="auth-heading">
        <span class="auth-kicker">Your workspace awaits</span>
        <h2 class="auth-title">Welcome back</h2>
        <p class="auth-subtitle">Sign in to manage your transport business.</p>
      </div>

      <form (ngSubmit)="login()" class="auth-form">
        <div class="auth-field">
          <label>Mobile Number</label>
          <input type="tel" [(ngModel)]="mobileNumber" name="mobileNumber" required
            autocomplete="tel" inputmode="numeric" minlength="10" maxlength="10" pattern="[0-9]{10}"
            title="Enter a 10-digit mobile number" placeholder="Enter your 10-digit mobile number">
        </div>

        <div class="auth-field">
          <label>Password</label>
          <div class="auth-input-wrap">
            <input [type]="showPassword ? 'text' : 'password'" [(ngModel)]="password" name="password" required
              autocomplete="current-password" placeholder="Enter your password">
            <button type="button" (click)="togglePassword()"
              class="app-icon-button app-icon-button--quiet app-icon-button--small auth-password-toggle"
              [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'">
              <i class="material-icons">{{ showPassword ? 'visibility_off' : 'visibility' }}</i>
            </button>
          </div>
        </div>

        <button type="submit" [disabled]="isLoading" class="app-button app-button--primary app-button--block">
          {{ isLoading ? 'Logging in...' : 'Login' }}
        </button>

        <div class="auth-links">
          <a (click)="routeTo('/auth/forgot-password')">Forgot password?</a>
          <a (click)="routeTo('/auth/signup')">Create account</a>
        </div>
      </form>
    </div>
  </div>
</div>
